[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rivet-code-agent"
version = "1.4.0"
description = "A small coding agent built from first principles"
readme = "README.txt"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
rivet = "rivet.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

